# Small, fast DP-heavy experiment used by the test suite only.
extends:
  - ../../experiments/base/run-defaults.yaml
  - ../../experiments/base/topology-clos-small.yaml
  - ../../experiments/base/routing-default.yaml
  - ../../experiments/base/stall_regime-default.yaml
  - ../../experiments/base/ai_workload-default.yaml
name: test-dp-small
ai_workload:
  steps: 2
  num_buckets: 1
  # 64 MTU packets per participant, so ring chunks stay whole packets for 16, 32 or 64 hosts.
  bucket_bytes_per_participant: 262144
  prolog_compute_ms: 0.0
  bucket_interval_ms: 0.0
  bucket_scheduling: concurrent
  optimizer_ms: 0.0
