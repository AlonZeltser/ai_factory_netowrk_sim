# Small, fast DP-heavy experiment used by the test suite only.
extends:
  - ../../experiments/base/run-defaults.yaml
  - ../../experiments/base/topology-clos-small.yaml
  - ../../experiments/base/workload-dp.yaml
meta:
  name: test-dp-small
  description: Minimal DP-heavy run for unit tests
workload:
  params:
    steps: 2
    num_buckets: 1
    # 64 MTU packets per participant, so ring chunks stay whole packets for 16, 32 or 64 hosts.
    bucket_bytes_per_participant: 262144
    t_fwd_bwd_ms: 0.0
    optimizer_ms: 0.0
