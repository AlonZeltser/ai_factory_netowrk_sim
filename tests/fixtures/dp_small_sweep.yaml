# dp_small.yaml plus a sweep plan, used by the sweep-config tests.
extends: dp_small.yaml
name: test-dp-small-sweep
sweep:
  vary:
    routing.mode: [ecmp, adaptive]
    ai_workload.flow_redundancy_extra_packets: [0, 1]
  summary_out: repo:results/test-dp-small-sweep/summary.yaml
  visualize_summary: false
  plot_ring_heatmaps: false
  lower_zoom_percent: 15.0
  stop_on_error: false
  processes: auto
  plot_topology_once: false
  show_visualization_window: false
  paper_style: false
  gantt_pdfs: false
  gantt_chain_limit: 40
  gantt_compare: {}
